api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  demo_log_source:
    type: demo_logs
    count: 0
    format: json

  app_logs_source:
    type: "file"
    include:
      - "${APP_LOG_DIR}/app.log"

transforms:
  app_logs_transform:
    type: remap
    inputs:
      - app_logs_source
    # sets `.` to an array of objects
    source: ". = parse_json!(.message)"

# add max size to avoid backpressure issues
sinks:
  sink_dynatrace_log:
    type: http
    inputs:
      - demo_log_source
      - app_logs_transform
    uri: "${DT_BASE_URL}/api/v2/logs/ingest"
    method: post
    compression: gzip
    encoding:
      codec: json
    request:
      headers:
        Authorization: "Api-Token ${DT_API_TOKEN}"
        Content-Type: "application/json; charset=utf-8"